<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 790" width="1200" height="790" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="page" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E6F7F4"/>
      <stop offset="1" stop-color="#EEF2FF"/>
    </linearGradient>
    <linearGradient id="teal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0F766E"/>
      <stop offset="1" stop-color="#14B8A6"/>
    </linearGradient>
    <filter id="card" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0F3D3A" flood-opacity="0.12"/>
    </filter>
    <filter id="phone" x="-10%" y="-5%" width="120%" height="115%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#0B1F33" flood-opacity="0.30"/>
    </filter>
    <clipPath id="scr"><rect width="304" height="624" rx="28"/></clipPath>
  </defs>

  <rect width="1200" height="790" fill="url(#page)"/>

  <text x="600" y="48" text-anchor="middle" font-size="28" font-weight="800" fill="#0B1F33">Portal de documentación y consultas</text>

  <!-- Marcos de teléfono -->
  <g filter="url(#phone)">
    <rect x="60" y="90" width="320" height="640" rx="38" fill="#0B1F33"/>
    <rect x="440" y="90" width="320" height="640" rx="38" fill="#0B1F33"/>
    <rect x="820" y="90" width="320" height="640" rx="38" fill="#0B1F33"/>
  </g>

  <!-- ================= PANTALLA 1: INGRESO ================= -->
  <g transform="translate(68,98)" clip-path="url(#scr)">
    <rect width="304" height="624" fill="#F3FAF9"/>
    <path d="M0 0 H304 V215 Q152 275 0 215 Z" fill="url(#teal)"/>
    <circle cx="40" cy="40" r="70" fill="#FFFFFF" opacity="0.07"/>
    <circle cx="290" cy="170" r="60" fill="#FFFFFF" opacity="0.07"/>

    <circle cx="152" cy="92" r="34" fill="#FFFFFF"/>
    <rect x="132" y="80" width="40" height="28" rx="7" fill="#0F766E"/>
    <rect x="156" y="88" width="16" height="12" rx="6" fill="#FFFFFF"/>
    <circle cx="163" cy="94" r="2.5" fill="#0F766E"/>

    <text x="152" y="152" text-anchor="middle" font-size="19" font-weight="800" fill="#FFFFFF">Portal de Documentación</text>
    <text x="152" y="174" text-anchor="middle" font-size="19" font-weight="800" fill="#FFFFFF">y Consultas</text>
    <text x="152" y="195" text-anchor="middle" font-size="11" fill="#CCFBF1">Valida tus documentos y consulta tus pagos</text>

    <g filter="url(#card)">
      <rect x="20" y="240" width="264" height="300" rx="22" fill="#FFFFFF"/>
    </g>
    <text x="40" y="276" font-size="18" font-weight="800" fill="#0B1F33">Bienvenido</text>
    <text x="40" y="296" font-size="11" fill="#64748B">Ingresa para ver tus pagos.</text>

    <text x="40" y="326" font-size="11" font-weight="700" fill="#0F766E">Código de emprendedor</text>
    <rect x="40" y="334" width="224" height="40" rx="12" fill="#F1F5F9" stroke="#E2E8F0"/>
    <text x="54" y="359" font-size="12" fill="#94A3B8">Ej. 123456</text>

    <text x="40" y="398" font-size="11" font-weight="700" fill="#0F766E">Número de documento</text>
    <rect x="40" y="406" width="224" height="40" rx="12" fill="#F1F5F9" stroke="#E2E8F0"/>
    <text x="54" y="431" font-size="12" fill="#94A3B8">Sin puntos ni espacios</text>

    <rect x="40" y="466" width="224" height="44" rx="14" fill="url(#teal)"/>
    <text x="152" y="493" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF">Ingresar</text>

    <text x="152" y="575" text-anchor="middle" font-size="12" fill="#64748B">¿Dudas con tu pago?</text>
    <text x="152" y="595" text-anchor="middle" font-size="12" font-weight="700" fill="#0F766E">Habla con el asistente</text>

    <rect x="112" y="8" width="80" height="20" rx="10" fill="#0B1F33"/>
  </g>

  <!-- ================= PANTALLA 2: DOCUMENTOS (COLOMBIA) ================= -->
  <g transform="translate(448,98)" clip-path="url(#scr)">
    <rect width="304" height="624" fill="#F3FAF9"/>
    <rect width="304" height="130" fill="url(#teal)"/>
    <text x="20" y="66" font-size="19" font-weight="800" fill="#FFFFFF">Mis documentos</text>
    <text x="20" y="86" font-size="11" fill="#CCFBF1">Colombia · Validación automática</text>
    <circle cx="268" cy="62" r="18" fill="#FFFFFF" opacity="0.25"/>
    <text x="268" y="67" text-anchor="middle" font-size="12" font-weight="700" fill="#FFFFFF">CO</text>

    <g filter="url(#card)"><rect x="16" y="98" width="272" height="96" rx="22" fill="#FFFFFF"/></g>
    <text x="34" y="124" font-size="11" fill="#64748B">Estado de tu validación</text>
    <text x="34" y="148" font-size="16" font-weight="800" fill="#0B1F33">3 de 3 documentos validados</text>
    <rect x="34" y="158" width="236" height="8" rx="4" fill="#E2E8F0"/>
    <rect x="34" y="158" width="236" height="8" rx="4" fill="url(#teal)"/>
    <text x="34" y="184" font-size="10" font-weight="700" fill="#15803D">Listo para el pago de tus comisiones</text>

    <g filter="url(#card)"><rect x="16" y="208" width="272" height="92" rx="18" fill="#FFFFFF"/></g>
    <rect x="30" y="224" width="48" height="48" rx="12" fill="#E0F2F1"/>
    <polygon points="54,230 72,240 36,240" fill="#0F766E"/>
    <rect x="40" y="243" width="5" height="12" rx="1" fill="#0F766E"/>
    <rect x="51.5" y="243" width="5" height="12" rx="1" fill="#0F766E"/>
    <rect x="63" y="243" width="5" height="12" rx="1" fill="#0F766E"/>
    <rect x="36" y="257" width="36" height="3" rx="1.5" fill="#0F766E"/>
    <text x="92" y="238" font-size="13" font-weight="800" fill="#0B1F33">Ficha bancaria</text>
    <text x="92" y="254" font-size="10" fill="#64748B">Certificación de cuenta</text>
    <rect x="92" y="262" width="92" height="20" rx="10" fill="#DCFCE7"/>
    <path d="M101 272 l3.5 3.5 l6 -7" fill="none" stroke="#15803D" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="116" y="276" font-size="10" font-weight="700" fill="#15803D">Validado</text>
    <text x="272" y="276" text-anchor="end" font-size="9" fill="#94A3B8">PDF</text>

    <g filter="url(#card)"><rect x="16" y="312" width="272" height="92" rx="18" fill="#FFFFFF"/></g>
    <rect x="30" y="328" width="48" height="48" rx="12" fill="#E0F2F1"/>
    <rect x="39" y="340" width="30" height="22" rx="4" fill="#0F766E"/>
    <circle cx="49" cy="349" r="3.5" fill="#FFFFFF"/>
    <path d="M44 357 q5 -6 10 0 z" fill="#FFFFFF"/>
    <rect x="57" y="346" width="8" height="2" rx="1" fill="#FFFFFF"/>
    <rect x="57" y="351" width="8" height="2" rx="1" fill="#FFFFFF"/>
    <text x="92" y="342" font-size="13" font-weight="800" fill="#0B1F33">Documento de identidad</text>
    <text x="92" y="358" font-size="10" fill="#64748B">Cédula de ciudadanía</text>
    <rect x="92" y="366" width="92" height="20" rx="10" fill="#DCFCE7"/>
    <path d="M101 376 l3.5 3.5 l6 -7" fill="none" stroke="#15803D" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="116" y="380" font-size="10" font-weight="700" fill="#15803D">Validado</text>
    <text x="272" y="380" text-anchor="end" font-size="9" fill="#94A3B8">PDF</text>

    <g filter="url(#card)"><rect x="16" y="416" width="272" height="92" rx="18" fill="#FFFFFF"/></g>
    <rect x="30" y="432" width="48" height="48" rx="12" fill="#E0F2F1"/>
    <rect x="42" y="442" width="24" height="28" rx="4" fill="#0F766E"/>
    <rect x="47" y="448" width="14" height="2" rx="1" fill="#FFFFFF"/>
    <rect x="47" y="454" width="14" height="2" rx="1" fill="#FFFFFF"/>
    <rect x="47" y="460" width="9" height="2" rx="1" fill="#FFFFFF"/>
    <text x="92" y="446" font-size="13" font-weight="800" fill="#0B1F33">RUT</text>
    <text x="92" y="462" font-size="10" fill="#64748B">Registro Único Tributario</text>
    <rect x="92" y="470" width="92" height="20" rx="10" fill="#DCFCE7"/>
    <path d="M101 480 l3.5 3.5 l6 -7" fill="none" stroke="#15803D" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="116" y="484" font-size="10" font-weight="700" fill="#15803D">Validado</text>
    <text x="272" y="484" text-anchor="end" font-size="9" fill="#94A3B8">PDF</text>

    <rect x="16" y="526" width="272" height="44" rx="14" fill="url(#teal)"/>
    <text x="152" y="553" text-anchor="middle" font-size="13" font-weight="700" fill="#FFFFFF">Subir o reemplazar documento</text>
    <text x="152" y="594" text-anchor="middle" font-size="10" fill="#64748B">Se validan automáticamente al llegar a tu correo</text>

    <rect x="112" y="8" width="80" height="20" rx="10" fill="#0B1F33"/>
  </g>

  <!-- ================= PANTALLA 3: ASISTENTE ================= -->
  <g transform="translate(828,98)" clip-path="url(#scr)">
    <rect width="304" height="624" fill="#F3FAF9"/>
    <rect width="304" height="100" fill="url(#teal)"/>
    <circle cx="36" cy="62" r="19" fill="#FFFFFF"/>
    <rect x="26" y="55" width="20" height="16" rx="5" fill="#0F766E"/>
    <circle cx="32" cy="63" r="2.2" fill="#FFFFFF"/><circle cx="40" cy="63" r="2.2" fill="#FFFFFF"/>
    <line x1="36" y1="55" x2="36" y2="50" stroke="#0F766E" stroke-width="2"/>
    <circle cx="36" cy="49" r="2" fill="#0F766E"/>
    <text x="66" y="58" font-size="15" font-weight="800" fill="#FFFFFF">Asistente de pagos</text>
    <circle cx="70" cy="74" r="4" fill="#4ADE80"/>
    <text x="80" y="78" font-size="10" fill="#CCFBF1">En línea</text>

    <g filter="url(#card)">
      <rect x="16" y="116" width="210" height="52" rx="16" fill="#FFFFFF"/>
    </g>
    <text x="30" y="138" font-size="11" fill="#0B1F33">Hola Camila, soy tu asistente.</text>
    <text x="30" y="154" font-size="11" fill="#0B1F33">¿En qué te ayudo hoy?</text>

    <rect x="70" y="184" width="218" height="52" rx="16" fill="#0F766E"/>
    <text x="84" y="206" font-size="11" fill="#FFFFFF">¿Cuándo me pagan la comisión</text>
    <text x="84" y="222" font-size="11" fill="#FFFFFF">de esta semana?</text>

    <g filter="url(#card)">
      <rect x="16" y="252" width="236" height="70" rx="16" fill="#FFFFFF"/>
    </g>
    <text x="30" y="274" font-size="11" fill="#0B1F33">Tu comisión ya fue validada.</text>
    <text x="30" y="290" font-size="11" fill="#0B1F33">El depósito se refleja el</text>
    <text x="30" y="306" font-size="11" fill="#0B1F33">viernes.</text>

    <rect x="96" y="338" width="192" height="36" rx="16" fill="#0F766E"/>
    <text x="110" y="361" font-size="11" fill="#FFFFFF">¿Me falta algún documento?</text>

    <g filter="url(#card)">
      <rect x="16" y="390" width="250" height="70" rx="16" fill="#FFFFFF"/>
    </g>
    <text x="30" y="412" font-size="11" fill="#0B1F33">Todo en orden. Recibimos y</text>
    <text x="30" y="428" font-size="11" fill="#0B1F33">validamos tus 3 documentos</text>
    <text x="30" y="444" font-size="11" fill="#0B1F33">enviados por correo.</text>

    <rect x="16" y="474" width="156" height="26" rx="13" fill="#DCFCE7"/>
    <path d="M28 487 l4 4 l7 -8" fill="none" stroke="#15803D" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="46" y="491" font-size="10" font-weight="700" fill="#15803D">Documentos validados</text>

    <rect x="16" y="520" width="108" height="28" rx="14" fill="#FFFFFF" stroke="#14B8A6"/>
    <text x="70" y="538" text-anchor="middle" font-size="10" font-weight="600" fill="#0F766E">Ver mis facturas</text>
    <rect x="132" y="520" width="108" height="28" rx="14" fill="#FFFFFF" stroke="#14B8A6"/>
    <text x="186" y="538" text-anchor="middle" font-size="10" font-weight="600" fill="#0F766E">Mi último pago</text>

    <rect x="16" y="568" width="272" height="42" rx="21" fill="#FFFFFF" stroke="#E2E8F0"/>
    <text x="36" y="594" font-size="11" fill="#94A3B8">Escribe tu pregunta...</text>
    <circle cx="264" cy="589" r="15" fill="url(#teal)"/>
    <path d="M257 589 H271 M265 583 L271 589 L265 595" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

    <rect x="112" y="8" width="80" height="20" rx="10" fill="#0B1F33"/>
  </g>

  <!-- Leyendas -->
  <g font-size="14" font-weight="700" fill="#0B1F33" text-anchor="middle">
    <text x="220" y="760">1 · Ingreso seguro</text>
    <text x="600" y="760">2 · Documentos (ejemplo Colombia)</text>
    <text x="980" y="760">3 · Asistente de IA</text>
  </g>
</svg>
